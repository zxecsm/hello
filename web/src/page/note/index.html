<!doctype html>
<html>
  <head></head>
  <body style="opacity: 0">
    <div id="app">
      <div class="page_search_wrap">
        <div class="inp_box">
          <input class="search_inp" name="search" autocomplete="off" type="text" />
          <i data-cursor="pointer" class="clear iconfont icon-shibai"></i>
        </div>
        <div class="res_total_num"></div>
        <div flag="pre" class="prev_btn iconfont icon-shang" data-cursor="pointer"></div>
        <div flag="next" class="next_btn iconfont icon-xiala" data-cursor="pointer"></div>
        <div flag="x" class="close_btn iconfont icon-close-bold" data-cursor="pointer"></div>
      </div>
      <div class="set_btns_wrap">
        <div class="set_top">
          <div data-cursor="pointer" class="show_erweima_btn iconfont icon-erweima"></div>
          <div data-cursor="pointer" class="copy_md_btn iconfont icon-fuzhi"></div>
          <div data-cursor="pointer" class="show_search_wrap iconfont icon-search"></div>
          <div data-cursor="pointer" class="font_size_btn iconfont icon-font-size"></div>
          <div data-cursor="pointer" class="edit_note_btn iconfont icon-bianji"></div>
          <div data-cursor="pointer" class="change_theme_btn iconfont icon-icon_yejian-yueliang"></div>
          <div data-cursor="pointer" class="note_box_width iconfont icon-kuandukuoda"></div>
        </div>
        <div class="set_bot">
          <div data-cursor="pointer" class="show_navigation_btn iconfont icon-lliebiao"></div>
          <div data-cursor="pointer" class="set_btn">
            <span class="iconfont icon-shezhi"></span>
          </div>
          <div data-cursor="pointer" class="to_top_btn iconfont icon-shang"></div>
        </div>
      </div>
      <div class="content_wrap">
        <div class="fill_box"></div>
        <div class="author_info">
          <div data-cursor="pointer" class="logo"></div>
        </div>
        <div class="note_info">
          <h1></h1>
          <div></div>
        </div>
        <div class="note_box view_md"></div>
      </div>
      <div class="note_dir_wrap">
        <ul class="list_box"></ul>
      </div>
    </div>
  </body>
</html>
